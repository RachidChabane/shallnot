schema_version: "1.1"
name: not-gated
tags: [negative]
runs: 1
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    Passwords that contain the account's username should be rejected. Can you add that?
context:
  scaffold_script: scaffold.sh
graders:
  - name: leaves-shallnot-out
    type: tool_used
    tool: Bash
    input_match: 'shallnot'
    min: 0
    max: 0
  - name: implements-the-behaviour
    type: regex
    target: {source: file, path: password.py}
    pattern: 'username'
    match: 'count:2'
