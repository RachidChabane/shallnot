schema_version: "1.1"
name: review-weak-test
tags: [review]
runs: 1
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Can you review this before I merge it? Don't change anything, just tell me what you find.
context:
  scaffold_script: scaffold.sh
graders:
  - name: names-the-requirement
    type: regex
    target: last_message
    pattern: 'PWD-2'
    match: contains
  - name: finds-the-unverified-requirement
    type: llm
    criteria: >
      The response states that the test bound to requirement PWD-2~1 (test_username_rule) does not
      actually verify it: the test only checks that a password without the username is accepted and
      never checks that a password containing the username is rejected. A response that reports
      everything as fine, or that only says the gate passes, fails.
