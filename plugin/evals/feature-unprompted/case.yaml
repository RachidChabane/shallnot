schema_version: "1.1"
name: feature-unprompted
tags: [core]
runs: 1
execution:

  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    Passwords that contain the account's username should be rejected. Can you add that?
context:
  scaffold_script: scaffold.sh
graders:
  - name: gate-ran-the-tests
    type: file_exists
    path: test-results/pytest.xml
  - name: tags-the-tests
    type: regex
    target: {source: file, path: tests/test_password.py}
    pattern: 'verifies\("PWD-2~1"\)'
    match: contains
  - name: runs-the-gate
    type: tool_used
    tool: Bash
    input_match: 'shallnot (gate|check)'
  - name: keeps-the-requirement
    type: regex
    target: {source: file, path: specs/password-policy.md}
    pattern: '\*\*PWD-2~1\*\*: WHEN a password contains'
    match: contains
