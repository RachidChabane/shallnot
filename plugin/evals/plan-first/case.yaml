schema_version: "1.1"
name: plan-first
tags: [plan]
runs: 1
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    Passwords should also have to contain at least one digit. Can you add that?
context:
  scaffold_script: scaffold.sh
graders:
  - name: states-the-requirement
    type: regex
    target: {source: file, path: specs/password-policy.md}
    pattern: 'PWD-4(~1)?(\*\*|`)?\s*:'
    match: contains
  - name: tags-the-tests
    type: regex
    target: {source: file, path: tests/test_password.py}
    pattern: 'verifies\("PWD-4~1"\)'
    match: contains
  - name: keeps-earlier-requirements
    type: regex
    target: {source: file, path: specs/password-policy.md}
    pattern: '\*\*PWD-1~1\*\*: WHEN a password is shorter than 12 characters'
    match: contains
  - name: gate-ran-the-tests
    type: file_exists
    path: test-results/pytest.xml
