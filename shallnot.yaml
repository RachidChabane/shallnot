version: 1
id_pattern: 'SN-[0-9]+'
specs:
  - specs
tests:
  - internal
  - schemas
  - plugin
results:
  - build/test-results/*.xml
exclude:
  - '**/testdata/**'
  - '**/*.md'
  - '**/*.json'
test_commands:
  - go tool gotestsum --format pkgname --junitfile build/test-results/go.xml -- -count=1 ./...
severities:
  tag_not_in_results: error
  bound_non_testable: error
